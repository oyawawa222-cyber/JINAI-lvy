<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广州11区</title>
  <link rel="stylesheet" href="/src/css/style.css">
  <style>
    /* 全局重置，消除默认边距、底部空白根源 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      transform-origin: left top;
  
    /* 区域选择按钮 */
    .area-select-btn{
      position: fixed;
      bottom: 20px;
      left: 120px;
      border: 3px solid #000000;
      background-color: #b1472C;
      color: #f4efe3;
      padding: 8px 16px;
      font-size: 16px;
      z-index: 9999;
      cursor: pointer;
      box-sizing: border-box;
    }
    /* 按钮禁用样式 */
    .area-select-btn.disabled{
      pointer-events: none;
      opacity: 0.6;
    }
    html {
  margin: 0;
  padding: 0;
  height: 100vh;
  overflow: hidden;
  transform-origin: left top;
  scroll-behavior: auto !important;
}
.scroll-wrap {
  width: 100vw;
  height: 100vh;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  will-change: scroll-position;
  transform: translateZ(0);
}
.scroll-wrap::-webkit-scrollbar {
  height: 0;
  display: none;
}
.scroll-content {
  display: flex;
  width: max-content;
  will-change: transform;
  transform: translateZ(0);
}
.media-box{
  position: relative;
  width: 1600px;
  height: 900px;
  flex-shrink: 0;
  background: #f4efe3;
  will-change: transform;
  transform: translateZ(0);
}
.media-item {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transform: translateZ(0);
  backface-visibility: hidden;
}
#matchStick{
  position: fixed;
  pointer-events: none;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 60px;
  z-index: 99980;
  will-change: transform, left, top;
  backface-visibility: hidden;
  perspective: 1000px;
}
#matchStick img{
  display: block;
  width: 100%;
  height: 100%;
  transform: translateZ(0);
}




    /* 区域弹窗：按钮正上方，宽度与按钮完全一致 */
    .area-pop{
      position: fixed;
      bottom: calc(20px + 44px);
      left: 120px;
      border: 3px solid #000000;
      background-color: #f4efe3;
      padding: 0;
      z-index: 10000;
      display: none;
      width: calc(102px);
      box-sizing: border-box;
    }
    .area-list{
      padding: 6px 0;
    }
    .area-item{
      padding: 6px 12px;
      cursor: pointer;
      text-align: center;
    }
    .area-item:hover{
      background:rgba(0,0,0,0.1);
    }
    .area-mask{
      display:none;
    }
    /* 每个区域自带标签，跟随区块滚动，填充色 #f3efe5 */
    .area-label{
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 6px 14px;
      border: 4px solid #000000;
      font-size: 18px;
      font-weight: bold;
      background: #f3efe5;
      z-index: 99;
      pointer-events: none;
    }
    /* 横向滚动主容器 修复底部滚动条空白 */
    .scroll-wrap {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .scroll-wrap::-webkit-scrollbar {
      height: 0;
      display: none;
    }
    /* 滚动内容flex布局，宽度贴合所有地图总尺寸，不拉伸 */
    .scroll-content {
      display: flex;
      width: max-content;
    }
    /* 单张地图容器：固定宽高，禁止压缩 */
    .media-box{
      position: relative;
      /* 替换为你地图原图真实宽高，示例1600宽 900高 */
      width: 1600px;
      height: 900px;
      flex-shrink: 0; /* 核心：禁止盒子被挤压缩小 */
      background: #f4efe3;
    }
    /* 地图图片填满容器，消除底部留白 */
    .media-item {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    /* 初始弹窗提升层级，在暗色遮罩上方 */
    .init-mask{
      z-index:9999;
    }
    .spot-btn{
      position: absolute;
      padding: 1px 12px;
      background-color: #f3efe5;
      color: #000;
      border: 2px solid #000;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transform-origin: left top;
    }
    .spot-btn:hover{
      background-color: #e8e2d4;
    }

/* 景点弹窗遮罩 */
.spot-mask{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 10001;
  display: none;
}
/* 弹窗居中 */
.spot-card{
  position: fixed;
  top: 50%;
  left: 30%;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  width: 777px;
  max-width: 92vw;
  background: #f3efe5;
  border: 4px solid #000000;
  padding: 24px;
  z-index: 10002;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s ease;
}
.spot-card.active{
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}
.spot-card-top{
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.spot-line{
  width: 40px;
  height: 3px;
  background: #000;
  flex-shrink: 0;
}
.spot-card-title{
  flex: 1;
  text-align: center;
  font-size: 20px;
  margin: 0;
}
.spot-close{
  border: 2px solid #000;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  background: #f3efe5;
  cursor: pointer;
  font-size: 16px;
  flex-shrink: 0;
}
.spot-text-box{
  line-height: 1.65;
  font-size: 15px;
  margin-bottom: 18px;
}
.official-btn{
  padding: 6px 14px;
  border: 2px solid #000;
  background: #f4efe3;
  cursor: pointer;
  color: #000;
}

  </style>
</head>
<body>

  <!-- 初始化全屏遮罩弹窗 -->
  <div class="init-mask">
    <div class="init-card">
      <p class="init-tip">广州11区·景点购票🎫</p>
      <h1 class="init-title">十一城韵・全域广州</h1>
      <div class="init-desc">
        专注广州十一区全域旅游，汇集越秀老城古韵、荔湾西关烟火、天河都市繁华、番禺欢乐游乐、从化增城山野康养等全城特色文旅资源。
在这里，你能找到地道游玩攻略、美食美景与小众打卡路线，一站式解锁广州全域风光，轻松玩转百变羊城。
      </div>
      <button class="init-close-btn">开始游玩💚</button>
      <p class="init-note">让我看看去哪玩🛫</p>
    </div>
  </div>

  <!-- 左右自动滚动感应区 -->
  <div class="scroll-sense left-sense"></div>
  <div class="scroll-sense right-sense"></div>

  <!-- 横向滚动主容器 -->
  <div class="scroll-wrap" id="scrollWrap">
    <div class="scroll-content">
      <!-- 1区 越秀区 -->
      <div class="media-box">
        <div class="area-label">越秀区</div>
        <img src="/yuex.png" alt="景点图" class="media-item" loading="eager">
        <button class="spot-btn" style="top: 125px; left: 855px;"
          data-name="越秀公园"
          data-desc="
          🕒时间：6：00 - 22：00
          🚇交通：地铁2号线越秀公园站A/B口
          🎫门票：免费（园内场馆另收费）
          介绍：坐落于越秀山之上，是广州中心城区规模最大的4A级综合公园、城市文化地标，也是读懂广州千年文脉的山水载体。
园内七岗三湖错落，林木葱郁、湖山相映，免费对外开放。标志性五羊石像源自五仙赠穗的古老传说，是“羊城”之名的由来；明代镇海楼（广州博物馆）、千年古城墙、中山纪念碑散落山间，串联起南越、明清至近代的城市记忆。
登高可俯瞰老城全貌，既能漫步湖堤享受城市绿意，也能寻访古迹触摸岭南千年底蕴，是本地人休闲、游客打卡的必到之地。"
          data-link="">
          <span class="dot-location"></span>
          <span>越秀公园</span>
        </button>
        <button class="spot-btn" style="top: 320px; left: 520px;"
          data-name="西汉南越王博物馆"
          data-desc="
          🕒时间：9：00 - 17：30
          🚇交通：地铁2号线越秀公园站E口
          🎫门票：10r
          介绍：紧邻越秀公园，为国家一级博物馆，依托1983年出土的南越文王赵眜陵墓建成，是全国重点文物保护单位，见证两千多年前岭南南越国的辉煌文明。
这座岭南保存最完整的汉代彩绘石室墓，出土文物超万件，丝缕玉衣、文帝行玺金印、犀角形玉杯、错金铜虎节等国宝级文物悉数陈列，清晰展现秦汉时期岭南的礼制、工艺与海上丝路贸易盛况。
红砂岩建筑设计古朴厚重，墓坑原址展厅直观还原汉代王侯墓葬形制，是探寻广州建城源头、了解南越古国历史的核心文博场馆。"
          data-link="https://www.nywmuseum.org.cn/">
          <span class="dot-location"></span>
          <span>西汉南越王博物馆</span>
        </button>
        <button class="spot-btn" style="top: 470px; left: 1050px;"
          data-name="北京路步行街"
          data-desc="
          🕒时间：全天开放
          🚇交通：地铁6号线北京路站B口
          🎫门票：免费
          介绍：广州千年城市中轴线，集千年历史、市井商业、广府烟火于一体的全天候文旅街区。
自秦汉南越国起便是番禺城核心商圈，路面玻璃栈道下完整封存 唐宋至明清十一层古道遗迹，被誉为 “中国千年古道活化石”。
沿街骑楼连绵，老字号食铺、新潮商场、糖水小吃、文创门店鳞次栉比，毗邻南越王宫遗址、大佛寺等古迹。
白日可探寻地下古道、打卡岭南骑楼，入夜霓虹璀璨，牛杂、肠粉、广式甜品等地道美食汇聚，一步跨越千年，既能沉浸式感受广州古今交融的商业文化，也能一站式体验地道广府烟火气。"
          data-link="">
          <span class="dot-location"></span>
          <span>北京路步行街</span>
        </button>
        <button class="spot-btn" style="top: 610px; left: 666px;"
          data-name="石室圣心大教堂"
          data-desc="
          🕒时间：8：30 - 17：00
          🚇交通：地铁6号线一德路站B口
          🎫门票：免费
介绍：本地人简称“石室”，坐落于一德路，是全国重点文保单位、全球四座全花岗岩哥特式教堂之一，有“远东巴黎圣母院”的美誉。
1863年奠基、1888年落成，历时25年由法国设计师规划、岭南石匠手工开凿全石材建造，58.5 米双尖塔直插天际，玫瑰彩窗、巨型石柱、中式石狮排水口融合中西建筑巧思，极具视觉震撼力。
教堂免费对外开放，内部光影透过彩色玻璃柔和绚烂，庄严肃穆；外部花岗岩石墙复古出片，是广州独树一帜的欧式历史地标，见证近代广州中西文化交融的岁月印记。"
          data-link="">
          <span class="dot-location"></span>
          <span>石室圣心大教堂</span>
        </button>
      </div>
      <!-- 2区 荔湾区 -->
      <div class="media-box">
        <div class="area-label">荔湾区</div>
        <img src="/liw.png" alt="景点图" class="media-item" loading="eager">
        <button class="spot-btn" style="top: 200px; left: 950px;"
          data-name="陈家祠"
          data-desc="
          🕒时间：9：00 - 17：30
          🚇交通：地铁1号线/8号线陈家祠站D口
          🎫门票：10r
介绍：坐落于荔湾区中山七路，始建于清光绪十四年，由广东七十二县陈氏族人合建，既是宗族祭祖、学子赴省备考的合族祠，如今为广东民间工艺博物馆，全国重点文保单位，素有“岭南建筑艺术明珠”美誉。
建筑群遵循三进三路九堂对称格局，青砖镬耳山墙错落，集木雕、砖雕、石雕、陶塑、灰塑、铜铁铸、彩绘“三雕二塑一铸一画”岭南工艺大成，屋脊布满戏曲人物、瑞兽花鸟彩塑，一砖一瓦皆藏民俗祈福寓意。
馆内陈列广彩、石湾公仔、广绣、剪纸等非遗手作，是读懂岭南传统营造技艺与宗族文化的必访地标。"
          data-link="https://www.gzcjc.com.cn/">
          <span class="dot-location"></span>
          <span>陈家祠</span>
        </button>
        <button class="spot-btn" style="top: 300px; left: 470px;"
          data-name="荔枝湾涌"
          data-desc="
          🕒时间：全天开放
          🚇交通：地铁5号线中山八站D口
          🎫门票：免费
介绍：西关千年水乡文脉地标，自古有“一湾溪水绿，两岸荔枝红”的盛景，南汉时期曾辟皇家园林、举办赏荔“红云宴”，是旧时“羊城八景”荔湾渔唱所在地。
河道曾被填埋暗渠，2010年复涌重生，全长2.4公里，串联多座仿古石拱桥、文塔、粤剧艺术博物馆。
沿岸榕树垂荫、亭台临水，可乘游船泛舟河上，沿路品尝马蹄糕、艇仔粥等西关地道小吃，小桥流水、镬耳民居相映，完整复刻岭南水乡悠然闲适的老城烟火，全天免费开放，尽显西关柔情水韵。"
          data-link="">
          <span class="dot-location"></span>
          <span>荔枝湾涌</span>
        </button>
        <button class="spot-btn" style="top: 450px; left: 660px;"
          data-name="永庆坊"
          data-desc="
          🕒时间：全天开放
          🚇交通：地铁1/6号线黄沙站B口
          🎫门票：免费
介绍：位于恩宁路骑楼街中段，广州老城微改造“绣花功夫”标杆、国家级非遗街区、4A级景区，紧连荔枝湾涌水系。
完整保留西关梳式麻石街巷、趟栊门、满洲窗、百年骑楼，留存李小龙祖居、銮舆堂、宝庆大押等80余处历史建筑。
街区融合传统与新潮：粤剧、广绣、榄雕、西关打铜等非遗工坊常驻，文艺小店、文创展馆、特色茶饮错落分布，傍晚河涌边常有粤曲传唱。
这里兼顾历史保护与市井活力，既能触摸百年武术、粤剧文脉，也能打卡新式网红街巷，生动诠释老城市新活力的西关范本。"
          data-link="">
          <span class="dot-location"></span>
          <span>永庆坊</span>
        </button>
        <button class="spot-btn" style="top: 600px; left: 950px;"
          data-name="沙面岛"
          data-desc="
          🕒时间：全天开放
          🚇交通：地铁1/6号线黄沙站F/E口
          🎫门票：免费（岛内场馆另收费）
介绍：白鹅潭畔四面环水的江心小岛，旧名拾翠洲，全国重点文物保护街区，被誉为 露天万国欧式建筑博物馆。
晚清至民国为英法租界，曾聚集十多国领事馆、外资洋行银行，全岛留存150余栋百年西洋建筑，涵盖新古典、巴洛克、哥特、券廊式多种风格，54栋列入国保单位。
岛内古树成荫、步道开阔，标志性露德圣母堂奶白哥特尖顶搭配彩窗光影，各式复古洋楼适合拍照；南端毗邻白天鹅宾馆，江边可眺望珠江日落。
中西历史在此交融，绿荫洋楼、江畔晚风，是广州独有的欧式慢生活打卡地。"
          data-link="">
          <span class="dot-location"></span>
          <span>沙面岛</span>
        </button>
      </div>
      <!-- 3区 海珠区 -->
      <div class="media-box">
        <div class="area-label">海珠区</div>
        <img src="/haiz.png" alt="景点图" class="media-item" loading="eager">
        <button class="spot-btn" style="top: 470px; left: 520px;"
          data-name="太古仓码头"
          data-desc="
          🕒时间：全天开放
          🚇交通：地铁8号线/广佛线沙园站A口
          🎫门票：免费
介绍：海珠区革新路珠江滨水文创街区，广州市文物保护单位，始建于1904年英国太古洋行，是近代广州重要外贸仓储码头，留存7座英式红砖仓库、三座T型混凝土栈桥与百年水塔，完整留存近代通商港口工业遗存风貌。
园区以“修旧如旧”活化改造，复古红砖厂房变身西餐厅、影院、美术馆、文创小店与滨江酒吧，岸边停泊游艇，沿江步道直面珠江，远处可眺望广州塔轮廓。
白日红砖光影适合复古港风拍照，黄昏江面落日温柔，入夜暖灯亮起、驻唱歌声相伴，兼具百年商埠厚重底蕴与浪漫潮流氛围感，也是珠江夜游登船码头，一站式集齐江景、复古建筑、美食与城市夜生活。"
          data-link="">
          <span class="dot-location"></span>
          <span>太古仓码头</span>
        </button>
        <button class="spot-btn" style="top: 180px; left: 755px;"
          data-name="广州塔"
          data-desc="
          🕒时间：09：30 - 22：30
          🚇交通：地铁3号线/APM线广州塔站B口
